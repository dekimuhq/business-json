name: release · publish to public npm

# Dispatch-only, from main only. Two jobs so that no code from a dev dependency
# ever runs with the right to mint a publish token:
#   build   — ci gate, every pre-publish check, `npm pack` → artifact. No id-token.
#   publish — `release` environment (required reviewer), downloads the tarball and
#             publishes exactly those bytes. No install, no build, no tests here.
#
# Auth: a repo created after 2026-07-15 gets GitHub's immutable OIDC subject,
# which npm's token exchange rejects (npm/cli#9969), so trusted publishing
# cannot work yet. The publish uses a short-lived granular token in
# NPM_BOOTSTRAP_TOKEN on the `release` environment — scoped to this package,
# 1-day expiry, deleted after each run
# (knowledge/public-lib-embargoed-release.md § npmjs auth). id-token stays for
# provenance.
#
# check:pinned-default fails while DEFAULT_VERIFIER_KEYS is empty: the CLI must
# not ship a default verifier whose keys come from whatever its web host serves.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run check:no-private-dep
      - run: npm run build
      - run: npm run check:pinned-default
      - run: npm run gen:schema && git diff --exit-code -- '*.schema.json'
      # Pack and upload BEFORE any test code runs, so nothing executed by the
      # test suite can alter the bytes that get published.
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball
          path: "*.tgz"
          if-no-files-found: error
          retention-days: 3
      - run: npm run typecheck:tests
      - run: npm test

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write   # provenance only — nothing else in this job runs package code
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball
      - name: Publish the built tarball (public, provenance)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          [ -n "$NODE_AUTH_TOKEN" ] || { echo "::error::NPM_BOOTSTRAP_TOKEN is not set on the release environment"; exit 1; }
          set -- *.tgz
          [ "$#" -eq 1 ] || { echo "::error::expected exactly one tarball, got $#"; exit 1; }
          npm publish "$1" --access public --provenance --ignore-scripts
